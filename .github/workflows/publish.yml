name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - run: dotnet publish Wingman/Wingman.csproj -c Release

      - name: Verify publish output
        shell: pwsh
        run: |
          $publishDir = "Wingman/bin/Release/net10.0-windows10.0.19041.0/win10-x64/publish"
          $files = Get-ChildItem -Path $publishDir -File
          Write-Host "Publish directory contents:"
          $files | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }
          $names = $files | ForEach-Object { $_.Name }
          if ($names.Count -ne 1 -or $names[0] -ne "Wingman.exe") {
            Write-Error "Expected only Wingman.exe, found: $($names -join ', ')"
            exit 1
          }
          Write-Host "OK - publish output clean"
