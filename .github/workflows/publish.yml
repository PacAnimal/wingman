name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - run: dotnet restore

      - run: dotnet build Wingman.sln -c Release --no-restore

      - run: dotnet test Wingman.Tests/Wingman.Tests.csproj -c Release --no-build

  publish:
    needs: [test]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Publish
        run: echo "Publishing... NOT"
